<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karian's Summoner · Bàn chơi ảo v7.0</title>
<link rel="icon" href="assets/icons/Fruit.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<!-- ?v=… : đổi số mỗi lần cập nhật để trình duyệt tải file mới, không dùng bản cũ trong bộ nhớ đệm -->
<link rel="stylesheet" href="style.css?v=8.9.0">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/icons/Fruit.webp" alt=""><span>Karian's Summoner<small>Bàn chơi ảo v7.0 · 1v1 với Máy</small></span>
    <button class="btn ghost" id="btnCards" type="button" title="Danh sách lá bài: toàn bộ quái và bản mở rộng">📚 Lá bài</button>
    <button class="btn ghost" id="btnBook" type="button" title="Luật chơi đầy đủ · Lượt mẫu · Hỏi đáp">📖 Luật chơi</button></div>
  <div class="status" id="status"></div>
  <div class="tools">
    <button class="btn ghost" id="btnRules" type="button">Luật nhanh</button>
    <button class="btn ghost" id="btnNew" type="button">Ván mới</button>
    <button class="btn warn" id="btnEnd" type="button" title="Dừng mọi xử lý và tải nhật ký lỗi">Kết thúc phiên</button>
  </div>
</header>

<main class="layout">
  <!-- Cột 1: lá bài đang xem (cố định, góc trái trên) + nhật ký (ẩn/hiện bằng nút trên thanh trên cùng) -->
  <aside class="col col-log" id="colLog">
    <section class="viewer cardview" id="viewer"></section>
    <section class="logbox"><h3>Nhật ký</h3><ol id="log"></ol></section>
  </aside>

  <!-- Cột 2: Máy + bàn thứ tự lượt -->
  <aside class="col col-mid">
    <section class="side-info" id="infoB"></section>
    <section class="steps" id="steps" aria-label="Thứ tự lượt chơi"></section>
  </aside>

  <!-- Bàn cờ 5 × 7 đứng riêng giữa rừng:
       hàng 1–3 sân Máy · hàng 4 xí ngầu (+ nút Thảy / Kết thúc lượt hai bên) · hàng 5–7 sân Bạn
       góc dưới trái: Gợi ý · góc dưới phải: vòng khắc hệ -->
  <section class="board" id="board">
    <!-- ánh nắng rọi xuống 2 vùng 3×3 (nằm dưới quái, không chặn chuột) -->
    <div class="sunfx sunB" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sunfx sunP" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <!-- đường sáng + tinh linh bay theo đường chia ô (vẽ ngẫu nhiên bởi sparkLines()) -->
    <div class="glines gB" aria-hidden="true"></div>
    <div class="glines gP" aria-hidden="true"></div>
    <span class="btag btagB">🤖 Máy</span>
    <div class="grid gridB" id="gridB"></div>
    <div class="bslot slot-roll" id="slotRoll"></div>
    <div class="dicebar" id="tray"></div>
    <div class="bslot slot-end" id="slotEnd"></div>
    <div class="bslot slot-cancel" id="slotCancel"></div>
    <span class="btag btagP">Bạn</span>
    <div class="grid gridP" id="gridP"></div>
    <div class="bslot slot-hint" id="slotHint"></div>
    <div class="bslot slot-deck" id="slotDeck"></div>
    <div class="wheel" id="wheel" title="Vòng khắc hệ: A → B nghĩa là A khắc B (+1 sát thương), bị khắc −1 (tối thiểu 1)"></div>
  </section>

  <!-- Cột 4: Bạn (năng lượng, chồng Công trình) + vách che -->
  <aside class="col col-right">
    <section class="side-info" id="infoP"></section>
    <section class="hand">
      <h3>Vách che · Dự bị <small>(kéo vào sân)</small></h3>
      <div class="handcards" id="hand"></div>
      <div id="bldArea"></div>
    </section>
  </aside>
</main>




<!-- dải sáng khi chọn mục tiêu (năng lượng / kỹ năng) -->
<svg class="beam" id="beam" aria-hidden="true"><path class="glow"/><path class="edge"/><path class="core"/><polygon class="head" points="0,0 0,0 0,0"/><circle class="ring" r="11"/></svg>
<div class="banner" id="banner" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>

<!-- bộ lọc khắc chìm cho icon hệ trên xí ngầu -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="engrave" x="-20%" y="-20%" width="140%" height="140%"><feFlood flood-color="#000" flood-opacity=".55"/><feComposite in2="SourceAlpha" operator="out"/><feOffset dx="2" dy="3"/><feGaussianBlur stdDeviation="1.8"/><feComposite in2="SourceAlpha" operator="in" result="sh"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge></filter></defs></svg>
<script src="data/luat-choi.js?v=8.9.0"></script>
<script src="script.js?v=8.9.0"></script>
</body>
</html>
