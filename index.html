<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karian's Summoner · Bàn chơi ảo v7.0</title>
<link rel="icon" href="assets/icons/Fruit.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<!-- ?v=… : đổi số mỗi lần cập nhật để trình duyệt tải file mới, không dùng bản cũ trong bộ nhớ đệm -->
<link rel="stylesheet" href="style.css?v=7.3.1">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/icons/Fruit.webp" alt=""><span>Karian's Summoner<small>Bàn chơi ảo v7.0 · 1v1 với Máy</small></span></div>
  <div class="status" id="status"></div>
  <div class="tools">
    <button class="btn ghost" id="btnRules" type="button">Luật nhanh</button>
    <button class="btn ghost" id="btnNew" type="button">Ván mới</button>
    <button class="btn warn" id="btnEnd" type="button" title="Dừng mọi xử lý và tải nhật ký lỗi">Kết thúc phiên</button>
  </div>
</header>

<main class="layout">
  <!-- Cột 1: nhật ký (cao hết màn hình) -->
  <aside class="col col-log">
    <section class="logbox"><h3>Nhật ký</h3><ol id="log"></ol></section>
  </aside>

  <!-- Cột 2: Máy + bàn thứ tự lượt -->
  <aside class="col col-mid">
    <section class="side-info" id="infoB"></section>
    <section class="steps" id="steps" aria-label="Thứ tự lượt chơi"></section>
  </aside>

  <!-- Cột 3: khay xí ngầu (dọc) -->
  <section class="tray" id="tray"></section>

  <!-- Cột 4: sân đấu — 1 sân liền, Máy ở trên, Bạn ở dưới -->
  <section class="field" id="field">
    <span class="ftag ftagB">🤖 Máy</span>
    <div class="grid gridB" id="gridB"></div>
    <div class="midline"></div>
    <div class="grid gridP" id="gridP"></div>
    <span class="ftag ftagP">Bạn</span>
  </section>

  <!-- Cột 5: xem thẻ lớn -->
  <section class="viewer" id="viewer"><p class="muted">Rê chuột / chạm vào một quái để xem thẻ.</p></section>

  <!-- Cột 6: Bạn (năng lượng, chồng Công trình), vách che, vòng khắc hệ -->
  <aside class="col col-right">
    <section class="side-info" id="infoP"></section>
    <section class="hand">
      <h3>Vách che · Dự bị <small>(kéo vào sân)</small></h3>
      <div class="handcards" id="hand"></div>
      <div id="bldArea"></div>
    </section>
    <section class="wheel" id="wheel" title="Vòng khắc hệ: A → B nghĩa là A khắc B (+1 sát thương), bị khắc −1 (tối thiểu 1)"></section>
  </aside>
</main>


<!-- dải sáng khi chọn mục tiêu (năng lượng / kỹ năng) -->
<svg class="beam" id="beam" aria-hidden="true"><path class="glow"/><path class="edge"/><path class="core"/><polygon class="head" points="0,0 0,0 0,0"/><circle class="ring" r="11"/></svg>
<div class="banner" id="banner" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>

<script src="script.js?v=7.3.1"></script>
</body>
</html>
